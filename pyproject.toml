[project]
name = "wvft-align"
version = "0.1.0"
description = "Live camera and FFT alignment utility for interferometers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10,<5",
    "pillow>=10.3",
    "sv-ttk>=2.6",
    "duvc-ctl>=2.0.1 ; sys_platform == 'win32'",
]

[project.scripts]
wvft-align = "wvft_align:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: opens a real camera (skipped unless -m hardware)",
]
addopts = "-m 'not hardware'"
